name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; only the image job below may publish packages.
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: libraflow
          POSTGRES_PASSWORD: libraflow
          POSTGRES_DB: libraflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U libraflow -d libraflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # BullMQ (overdue reminders) needs Redis when the E2E suite boots the app
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgres://libraflow:libraflow@localhost:5432/libraflow_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  # After the tests pass on main: build the Dockerfile and publish it to GitHub
  # Container Registry, tagged with the commit SHA (for rollbacks) and latest.
  # Pull requests never publish.
  image:
    needs: api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # GHCR image names must be lowercase (the owner is NaiEang)
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/libraflow-api" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Links the package to this repository on GitHub
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
