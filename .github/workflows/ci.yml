name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: libraflow
          POSTGRES_PASSWORD: libraflow
          POSTGRES_DB: libraflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U libraflow -d libraflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # BullMQ (overdue reminders) needs Redis when the E2E suite boots the app
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgres://libraflow:libraflow@localhost:5432/libraflow_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

